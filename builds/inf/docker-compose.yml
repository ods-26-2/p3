# ODS — build "inf": todas as inferências (I1–I9) numa build só (P3 / SIS-1).
#
#   cd builds/inf && ./inf.sh          (o inf.sh confere a placa, baixa o código e constrói em etapas)
#
# Variáveis em inf.env (commits fixados, Kafka, entradas). Sem segredos.
#
# Desenho (24/11/2026; desde 27/11 sobre a build inf_a4):
#   - I1 (detecção, GPU) e I2 (rastreio) NÃO estão aqui: são os da build inf_a4 (orquestrador do
#     I1, um modelo por vez na GPU, e o I2 contínuo), que tem de estar de pé. Esta build pede
#     detecções ao I1 dela por ods.i1.command (./inf.sh i1 <EQUIPE>) e consome ods.i1.detections
#     (I9). O I1 permanente (builds/i1) fica parado (dois orquestradores no mesmo Kafka).
#   - Contínuos (sobem com "up"): i6, i9. (I5 fora desde 24/11/2026, I4 desde 27/11/2026; I2 é o da
#     inf_a4 desde 27/11/2026)
#   - Sob demanda (perfis; o inf.sh roda cada um): i3, i7, i8.
#   - Sem P4 nesta build: cada inferência lê arquivo (vídeo/áudio) ou o barramento. O I7 também lê
#     o P4 (--p4) e o I1 lê o socket do P4 em /var/lib/ods/p4-shm, quando houver um P4 de pé.
#   - GPU (TensorRT pelo P2): o I1 (na inf_a4) e o detector do I7 (mesma engine app-plates
#     do I1, só leitura). O resto em CPU. O I5 da equipe para Jetson usa a base
#     l4t-pytorch r35 (JetPack 5), que não roda no JetPack 6.2.1 da placa: aqui vai uma imagem
#     do P3 em CPU (ods-i5-cpu), como no A7.
#
# Tópicos (Kafka compartilhado; o I1 publica ods.i1.detections):
#   i2  ods.i1.detections -> ods.i2.tracks   (o I2 da inf_a4)
#   i3  (correspondências / linhas da quadra) -> ods.i3.calibration + ods.artifact.published
#   i4  quadros do servidor (websocket 18080) -> ods.i4.sign, ods.i4.keypoints, ods.i4.facial_marker
#   i5  ods.p5.audio_chunk -> ods.i5.transcript  (i5-audio faz o papel do P5 com um arquivo)
#   i6  vídeo em laço -> ods.i6.code_read
#   i7  vídeo -> ods.i7.plate_read
#   i8  mocks 2.0 do próprio I8 -> ods.industria.defeito_classificado (sem modelo treinado no repo)
#   i9  ods.i1.detections (+ ods.i3.calibration, ods.artifact.published) -> ods.i9.ppe_compliance
name: ods-inf

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  kafka-topicos:
    # Cria, se ainda não existirem, os tópicos das inferências no Kafka. Roda e termina.
    image: confluentinc/cp-kafka:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ods.i1.command ods.i1.detections ods.i2.tracks ods.i3.calibration
        ods.artifact.published ods.i4.sign ods.i4.keypoints ods.i4.facial_marker
        ods.p5.audio_chunk ods.i5.transcript ods.i6.code_read ods.i7.plate_read
        ods.industria.defeito_classificado ods.i9.ppe_compliance; do
        kafka-topics --bootstrap-server ${KAFKA_BROKER:?defina KAFKA_BROKER} --create --if-not-exists
        --topic $$t --partitions 1 --replication-factor 1 || exit 1; done

  # ================================================================ I2 · rastreio (INV-1)
  # I2 FORA desde 27/11/2026 (decisão do usuário: a inf usa o I1 e o I2 da build inf_a4). Dois I2 no
  # mesmo Kafka publicariam cada trilha em dobro em ods.i2.tracks. Para voltar a ter um I2 próprio
  # (sem a inf_a4), descomente o bloco e devolva "i2" ao ETAPAS e ao aceite_conferir do inf.sh.
  # i2:
  #   build: ${SRC_DIR:?defina SRC_DIR}/i2
  #   image: ods-i2:${I2_REF:?fixe o commit do i2}
  #   restart: unless-stopped
  #   <<: *log
  #   # --fps: taxa nominal das detecções. Vale para todos os vídeos das equipes (o I1 lê ~25 q/s).
  #   command: ["--i1", "${KAFKA_BROKER}", "--kafka", "${KAFKA_BROKER}", "--fps", "25"]
  #   depends_on:
  #     kafka-topicos: { condition: service_completed_successfully }

  # ================================================================ I3 · calibração (INV-1)
  i3:
    # Artefato, não serviço: ./inf.sh i3. Calibra a quadra de vôlei do A4 pela imagem do próprio
    # repositório (sem clique: acha as linhas do chão pelo padrão FIVB) e publica a CALIBRATION
    # em ods.i3.calibration + ods.artifact.published, gravando o registro no volume i3-registro.
    # Versão e valid_from fixos: rodar de novo só reanuncia (o registro recusa conteúdo
    # diferente com a mesma versão). Para outra câmera, mude --versao.
    build: ${SRC_DIR}/i3
    image: ods-i3:${I3_REF:?fixe o commit do i3}
    profiles: [i3]
    restart: "no"
    command: ["--source-id", "inf-quadra", "--versao", "cal-inf-quadra-1",
              "--valido-desde", "2026-11-24T00:00:00+00:00",
              "--espaco", "quadra-volei-fivb", "--origem", "canto proximo esquerdo",
              "--eixos", "x ao longo dos 18 m, y afastando da camera",
              "--linhas", "dados/quadra_mediana.png", "--padrao", "padroes/quadra-volei-fivb.json",
              "--perto", "lateral y=0",
              "--registro", "/registro", "--kafka", "${KAFKA_BROKER}"]
    volumes:
      # A imagem do I3 não leva dados/ (só schemas, padroes e o código)
      - ${SRC_DIR}/i3/dados:/app/dados:ro
      - i3-registro:/registro

  # ======================= I4 FORA DA BUILD (27/11/2026, decisão do usuário) =======================
  # Pendências abertas no repositório do I4 (pyarrow sem teto com numpy<2, mediapipe sem versão
  # fixa; nada novo desde 503f64b, 17/11). Para voltar: descomente i4-server, i4 e i4-video abaixo e
  # reative as linhas marcadas "I4 fora" no inf.sh (ETAPAS, aceite_conferir, disparo e T-I4).
  # # ================================================================ I4 · Libras (INV-2)
  # i4-server:
  #   # Servidor C++ do I4 (dockerfile.server da equipe): recebe JPEG por websocket em
  #   # ws://<placa>:18080/ws/video (uma conexão por vez), detecta rosto e grava os quadros em
  #   # /dev/shm/frames_cam, que o i4 lê. Fonte: ./inf.sh i4 (vídeo) ou o webcam.py do I4.
  #   build:
  #     context: ${SRC_DIR}/i4
  #     dockerfile: dockerfile.server
  #   image: ods-i4-server:${I4_REF:?fixe o commit do i4}
  #   restart: unless-stopped
  #   <<: *log
  #   ipc: shareable
  #   shm_size: 256m
  #   ports:
  #     - "${I4_SERVER_BIND:-127.0.0.1}:18080:18080"
  #
  # i4:
  #   # Reconhecimento ao vivo (pipeline.live.ao_vivo), como no compose do próprio I4.
  #   build:
  #     context: ${SRC_DIR}/i4
  #     dockerfile: dockerfile.python
  #     args:
  #       REQS: requirements-i4.txt
  #   image: ods-i4:${I4_REF}
  #   restart: unless-stopped
  #   <<: *log
  #   ipc: "service:i4-server"
  #   command: ["python", "-m", "pipeline.live.ao_vivo", "--model", "/models/model_v4_e60s1_aug.pt",
  #             "--publish", "--expr-rules", "padrao"]
  #   environment:
  #     ODS_KAFKA_BOOTSTRAP: ${KAFKA_BROKER}
  #     PYTHONUNBUFFERED: "1"
  #   volumes:
  #     - ${SRC_DIR}/i4/models:/models:ro
  #   depends_on:
  #     i4-server: { condition: service_started }
  #     kafka-topicos: { condition: service_completed_successfully }
  #
  # i4-video:
  #   # Faz o papel da webcam: manda I4_VIDEO ao servidor, quadro a quadro, como o webcam.py do I4
  #   # (que só abre câmera, não arquivo). Script do P3 em ./i4. Sob demanda: ./inf.sh i4
  #   build:
  #     context: ./i4
  #     dockerfile_inline: |
  #       FROM python:3.11-slim-bookworm
  #       RUN pip install --no-cache-dir opencv-python-headless==4.10.0.84 websockets==13.1
  #   image: ods-i4-video:p3-1
  #   profiles: [i4]
  #   restart: "no"
  #   command: ["python", "-u", "/p3/i4/enviar_video.py", "/video/entrada.mp4",
  #             "--url", "ws://i4-server:18080/ws/video", "--fps", "${I4_VIDEO_FPS:-25}"]
  #   volumes:
  #     - ./i4:/p3/i4:ro
  #     - ${I4_VIDEO:?defina I4_VIDEO}:/video/entrada.mp4:ro

  # ======================= I5 FORA DA BUILD (24/11/2026, decisão do usuário) =======================
  # O usuário tem uma build própria do I5 na placa (imagem ods-i5-gpu); a imagem do P3 em CPU
  # (ods-i5-cpu) saiu para liberar disco. Para voltar: descomente os serviços i5 e i5-audio abaixo
  # e o volume i5-cache no fim, e reative as linhas marcadas "I5 fora" no inf.sh.
  # # ================================================================ I5 · fala (VER-4)
  # i5:
  #   # Modo de produção do I5 (scripts/1_principal_p5_kafka_p2.sh): consome ods.p5.audio_chunk,
  #   # VAD, Whisper e publica ods.i5.transcript. Imagem do P3 em CPU (ver o cabeçalho).
  #   # O broker do consumidor só vem do YAML: o P3 gera a config em /tmp a partir de ./i5,
  #   # trocando __KAFKA_BROKER__ pelo da build.
  #   build:
  #     context: ${SRC_DIR}/i5
  #     dockerfile_inline: |
  #       FROM python:3.11-slim-bookworm
  #       ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/app HF_HOME=/cache/huggingface
  #       RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg libsndfile1 \
  #           && rm -rf /var/lib/apt/lists/*
  #       # torch só de CPU antes do resto, para o pip não trazer as bibliotecas CUDA
  #       RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
  #       WORKDIR /app
  #       COPY requirements.txt .
  #       RUN pip install --no-cache-dir -r requirements.txt
  #       COPY src/ src/
  #       COPY config/ config/
  #       COPY data/ data/
  #   image: ods-i5-cpu:${I5_REF:?fixe o commit do i5}
  #   restart: unless-stopped
  #   <<: *log
  #   entrypoint: ["sh", "-c"]
  #   command:
  #     - >
  #       sed "s|__KAFKA_BROKER__|$$KAFKA_BROKER|" /p3/i5/pipeline_config.yaml > /tmp/i5.yaml &&
  #       if [ "$$I5_MODO" = wake-word ]; then set -- --wake-word --wake-words lexie; else set --; fi &&
  #       exec python -u src/pipeline.py --config /tmp/i5.yaml --kafka --publish-kafka
  #       --kafka-broker "$$KAFKA_BROKER" --kafka-topic ods.i5.transcript
  #       --origem "$$I5_ORIGEM" --no-save-json "$$@"
  #   environment:
  #     KAFKA_BROKER: ${KAFKA_BROKER}
  #     KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
  #     KAFKA_TOPIC: ods.i5.transcript
  #     I5_MODO: ${I5_MODO:-continuo}
  #     I5_ORIGEM: ${I5_ORIGEM:-mic_balcao_1}
  #   volumes:
  #     - ./i5:/p3/i5:ro
  #     - i5-cache:/cache
  #   depends_on:
  #     kafka-topicos: { condition: service_completed_successfully }

  # i5-audio:
  #   # Faz o papel do P5: fatia I5_AUDIO em ods.p5.audio_chunk (mock_p5_producer.py do I5).
  #   # Sob demanda: ./inf.sh i5
  #   image: ods-i5-cpu:${I5_REF}
  #   pull_policy: never
  #   profiles: [i5]
  #   restart: "no"
  #   command: ["python", "-u", "src/mock_p5_producer.py", "--file", "/audios/${I5_AUDIO:-audio4.ogg}",
  #             "--broker", "${KAFKA_BROKER}", "--topic", "ods.p5.audio_chunk"]
  #   volumes:
  #     - ${I5_AUDIO_DIR:?defina I5_AUDIO_DIR}:/audios:ro

  # ================================================================ I6 · QR (VER-2)
  i6:
    # DetectorQR em modo teste: relê VIDEO_DIR/I6_VIDEO em laço (o modo P4 espera um socket TCP
    # que o P4 não oferece). O vídeo padrão é gerado pelo inf.sh (i6-gerar-video).
    build: ${SRC_DIR}/i6/DetectorQR
    image: ods-i6:${I6_REF:?fixe o commit do i6}
    restart: unless-stopped
    <<: *log
    init: true
    environment:
      I6_TEST_MODE: "true"
      I6_TEST_CAMERAS_JSON: '[{"source_id":"${I6_SOURCE_ID:-cam-inf-qr}","url":"/videos/${I6_VIDEO:-inf-qr.mp4}"}]'
      I6_TEST_RECONNECT_SECONDS: "2.0"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      KAFKA_TOPIC: ods.i6.code_read
      I6_ARTIFACT_VERSION: i6-qrcode-reader-2.0
    volumes:
      - ${VIDEO_DIR:?defina VIDEO_DIR}:/videos:ro
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  i6-gerar-video:
    # Gera VIDEO_DIR/inf-qr.mp4 (QR "ODS-INF-P3" visível de 2 s a 6 s num vídeo de 20 s) com o
    # OpenCV da própria imagem do I6: uma leitura a cada volta do laço. Exemplo do P3.
    image: ods-i6:${I6_REF}
    pull_policy: never
    profiles: [i6]
    restart: "no"
    user: "${UID_GID:-1000:1000}"
    command: ["python", "-u", "/p3/i6/gerar_video_qr.py", "/videos/inf-qr.mp4"]
    volumes:
      - ./i6:/p3/i6:ro
      - ${VIDEO_DIR}:/videos

  # ================================================================ I7 · placas (VER-5)
  i7:
    # Lê VIDEO_DIR/I7_VIDEO (--video, 2 quadros/s do vídeo) e publica ods.i7.plate_read.
    # Configuração recomendada pela equipe no .env.example. Sob demanda: ./inf.sh i7
    #
    # GPU (P3, 24/11/2026): o detector do I7 é o pacote app-plates 1.0.0 do B5, o MESMO ONNX
    # (sha256 b698a519…) que o I1 já roda em TensorRT. Em vez do Dockerfile da equipe (P2 0.1.0
    # --cpu-only, com PyTorch e ultralytics, que o DETECTOR=p2 não importa), esta imagem do P3:
    #   - parte da mesma base TensorRT do I1 (camadas divididas com o ods-i1-gpu no disco);
    #   - instala o P2 0.2.0a1 [trt], o mesmo do I1 (a API usada pelo detector_p2.py não mudou);
    #   - lê a engine FP16 que o builds/i1 já compilou em ENGINES_DIR/app-plates-1.0.0 (só leitura);
    #   - deixa o OCR (fast-alpr, ONNX Runtime) em CPU.
    # numpy < 2 por causa do P2 (o OCR aceita os dois). Desfazer: voltar a "build: ${SRC_DIR}/i7"
    # com a imagem ods-i7 e tirar runtime/volume da engine.
    build:
      context: ${SRC_DIR}/i7
      dockerfile_inline: |
        ARG BASE_IMAGE
        FROM $${BASE_IMAGE}
        ENV DEBIAN_FRONTEND=noninteractive PYTHONUNBUFFERED=1 PIP_NO_CACHE_DIR=1 \
            CUDA_HOME=/usr/local/cuda PATH=/usr/local/cuda/bin:$${PATH} \
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$${LD_LIBRARY_PATH} \
            PYTHONPATH=/usr/lib/python3/dist-packages:/usr/lib/python3.10/dist-packages \
            P2_BACKEND=trt P2_ENGINE_DIR=/opt/ods/engines
        # GStreamer com Python (gi) só para o --p4 (leitura do socket do P4), como no I1
        RUN apt-get update && apt-get install -y --no-install-recommends \
                python3-pip libglib2.0-0 \
                python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            && rm -rf /var/lib/apt/lists/*
        # Python 3.10 da base: opencv 4.12+ exige numpy 2 (o P2 pede < 2) e o onnxruntime depois do
        # 1.23.2 não tem roda cp310 aarch64. Fixados para o pip não procurar versão por tentativa.
        RUN python3 -m pip install --upgrade pip && python3 -m pip install \
                "numpy>=1.21.6,<2" "opencv-python-headless==4.11.0.86" "onnxruntime==1.23.2" \
                "fast-alpr[onnx]==0.4.0" \
                "python-dotenv>=1.0" "confluent-kafka>=2.3" "typing_extensions>=4.10" \
                "p2[trt] @ https://github.com/ods-26-2/p2/releases/download/v0.2.0a1/p2-0.2.0a1-py3-none-any.whl"
        WORKDIR /app
        COPY scripts/ scripts/
      args:
        BASE_IMAGE: ${TRT_BASE_IMAGE:?defina TRT_BASE_IMAGE}
    image: ods-i7-gpu:${I7_REF:?fixe o commit do i7}
    profiles: [i7]
    restart: "no"
    runtime: nvidia
    entrypoint: ["sh", "-c"]
    command:
      - >
        if [ "$$I7_QUADROS" -gt 0 ] 2>/dev/null; then set -- -n "$$I7_QUADROS"; else set --; fi &&
        exec python3 "scripts/aplicacaoModelov5-fast+rodosol.py" --video "/videos/$$I7_VIDEO" "$$@"
    environment:
      I7_VIDEO: ${I7_VIDEO:-cam0.mp4}
      I7_QUADROS: ${I7_QUADROS:-20}
      DETECTOR: p2
      P2_ENGINE_REF: app-plates-1.0.0
      # trt: sem TensorRT o P2 falha em vez de cair para CPU em silêncio
      P2_BACKEND: trt
      NMS_ENTRE_CLASSES: sim
      OCR_MODELO: cct-s-v2-global-model
      PREPROCESSAMENTO: sim
      MARGEM_RECORTE_PCT: "0"
      MARGEM_RECORTE_MERCOSUL_PCT: "10"
      DOBRAR_2L: nao
      PRE_ALTURA_ALVO: "160"
      PRE_NITIDEZ: "0"
      PRE_PROPORCAO: "2"
      PASTA_SAIDA: /saidas
      PUBLICACAO_MODO: kafka
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPICO: ods.i7.plate_read
      SOURCE_ID: ${I7_SOURCE_ID:-cam-entrada}
    volumes:
      - ${VIDEO_DIR}:/videos:ro
      - ${ENGINES_DIR:?defina ENGINES_DIR}/app-plates-1.0.0:/opt/ods/engines/app-plates-1.0.0:ro
      - i7-saidas:/saidas
      - i7-cache:/root/.cache

  # ================================================================ I8 · inspeção de peças (VER-1)
  i8:
    # Publisher real do I8 (contrato 2.0) com os 4 eventos de exemplo do próprio I8
    # (shared/mocks/kafka-2.0), ids e horários novos. O repo não traz modelo treinado.
    # Mesmo script do A1 (builds/comum/i8). Sob demanda: ./inf.sh i8
    build:
      context: ${SRC_DIR}/i8
      dockerfile: validacao-local/Dockerfile.publisher
    image: ods-i8-publisher:${I8_REF:?fixe o commit do i8}
    profiles: [i8]
    restart: "no"
    user: "${UID_GID:-1000:1000}"
    environment:
      KAFKA_BROKER_URL: ${KAFKA_BROKER}
      KAFKA_TOPIC: ods.industria.defeito_classificado
      I8_TAXONOMIA_DIR: /taxonomias/${I8_TAXONOMIA_VERSAO:-defects-a1-1.0.0}
      I8_TAXONOMIA_VERSAO: ${I8_TAXONOMIA_VERSAO:-defects-a1-1.0.0}
    command: ["python", "/p3/i8/publicar_exemplos.py"]
    volumes:
      - ../comum/i8:/p3/i8:ro
      - ${SRC_DIR}/a1/shared/artifacts/defect-taxonomy:/taxonomias:ro

  # ================================================================ I9 · EPI (VER-3)
  i9:
    # Consome ods.i1.detections, ods.i3.calibration e ods.artifact.published (catálogo do A5,
    # opcional: sem ele vale a política padrão do I9); publica ods.i9.ppe_compliance.
    # O repo não tem Dockerfile; este é o do P3 (o mesmo do A5). O dataset (323 MB) fica fora.
    build:
      context: ${SRC_DIR}/i9/I9
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        WORKDIR /app
        COPY requirements-kafka.txt .
        RUN pip install --no-cache-dir -r requirements-kafka.txt
        COPY main.py calibrate.py evaluate.py optimize.py policy_calibrated.json ./
        COPY src/ src/
        COPY config/ config/
        COPY examples/ examples/
        COPY tools/ tools/
        CMD ["python", "-u", "main.py", "--kafka"]
    image: ods-i9:${I9_REF:?fixe o commit do i9}
    restart: unless-stopped
    <<: *log
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      I9_KAFKA_GROUP_ID: I9-inf
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

volumes:
  i3-registro:
  # i5-cache:   (I5 fora da build)
  i7-saidas:
  i7-cache:
