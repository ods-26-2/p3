# ODS — build do A3 · Monitoramento / eventos (VER-6)
# Montada a partir do código atual (branch dev do a3, 13/11/2026), não só do plano 6c.
#
# O que o código do A3 consome hoje (safety_app/services/kafka_engine.py):
#   ods.s1.zone_transition, ods.s2.entity, ods.s2.event   e publica ods.s3.alert.command
# A decisão de risco do A3 só reage a ods.s2.event; o S2 ainda não fala com o Kafka
# (develop e611a51 lê e grava JSON). Sem S2, o A3 sobe, mostra o painel e a cadeia chega
# até o S1, mas nenhum alerta nasce da cadeia. Lacuna registrada (pendência VER-6).
#
# Composição:
#   a3           painel Streamlit (porta 8501). O repo não tem Dockerfile nem requirements:
#                os deste compose são do P3. O broker está fixo no código (34.66.235.91:9093);
#                o contorno em ../comum/kafka_override troca pelo KAFKA_BROKER sem editar o código.
#   s3           alertas · VER-3. Sem ROUTING (o A3 não publicou o seu e não há S2): só atende
#                ods.s3.alert.command, que é o que o A3 envia.
#   i2, s1       rastreio e zonas (contínuos), como na build do A8; zonas de exemplo do P3
#   p4, i1       perfil "video": toca VIDEO_DIR/cam0.mp4 uma vez
#   s4, s5       perfil "cadeia": a 6c lista para o A3, mas o código atual não os consome
#
# Fora: S2 (sem Kafka). Uso: ./a3.sh · ./a3.sh video · ./a3.sh status · ./a3.sh parar

name: ods-a3

services:

  a3:
    build:
      context: ${SRC_DIR:?defina SRC_DIR}/a3
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        # Versões escolhidas pelo P3: o repositório do A3 não traz requirements.
        RUN pip install --no-cache-dir streamlit==1.40.2 pandas==2.2.3 plotly==5.24.1 confluent-kafka==2.6.1
        WORKDIR /app
        COPY safety_app/ safety_app/
        WORKDIR /app/safety_app
        EXPOSE 8501
        CMD ["streamlit", "run", "main.py", "--server.port", "8501", "--server.address", "0.0.0.0", \
             "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    image: ods-a3:${A3_REF:?fixe o commit do a3}
    restart: unless-stopped
    environment:
      # PROVISÓRIO: troca o broker fixo no código (34.66.235.91:9093) pelo da turma.
      # Quando o VER-6 ler o broker de variável de ambiente, tire estas duas linhas e o volume.
      PYTHONPATH: /p3/kafka_override
      ODS_KAFKA_FORCAR_BROKER: ${KAFKA_BROKER:?defina KAFKA_BROKER}
    volumes:
      - ../comum/kafka_override:/p3/kafka_override:ro
    ports:
      - "8501:8501"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s3:
    # Alertas e notificações · VER-3. Só comandos (sem --routing).
    build: ${SRC_DIR}/s3
    image: ods-s3:${S3_REF:?fixe o commit do s3}
    restart: unless-stopped
    command: ["--banco", "/dados/s3.sqlite3", "--criar-topicos", "--tempo-limite", "315360000"]
    environment:
      S3_KAFKA_BOOTSTRAP: ${KAFKA_BROKER}
      S3_KAFKA_GROUP_ID: S3-alertas-a3
      # Quem pode mandar comandos ao S3 (o broker não tem autenticação)
      S3_PRODUTORES_COMANDOS: A3
    volumes:
      - s3-dados:/dados
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  kafka-topicos:
    # Cria, se ainda não existirem, os tópicos desta build no Kafka da turma. Roda e termina.
    image: confluentinc/cp-kafka:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ods.session.started ods.p4.frame ods.i1.detections ods.i2.tracks
        ods.artifact.published ods.s1.position ods.s1.zone_transition ods.s1.zone_occupancy
        ods.s2.event ods.s2.entity ods.s3.alert ods.s3.alert.command ods.s3.alert.reply
        ods.s3.alert_action.command ods.s3.alert_action.reply ods.s3.alerts.query ods.s3.alerts.reply
        ods.s4.clip ods.s4.capture.command ods.s4.capture.reply ods.s4.clip.query ods.s4.clip.query.reply
        ods.s5.zone_metrics ods.s5.event_metrics ods.s5.metrics.query ods.s5.metrics.reply
        ods.s5.heatmap.query ods.s5.heatmap.reply; do
        kafka-topics --bootstrap-server ${KAFKA_BROKER} --create --if-not-exists
        --topic $$t --partitions 1 --replication-factor 1 || exit 1; done

  # ======================= cadeia (como na build do A8) =======================

  p4:
    # Fonte de vídeo · SIS-2. O repo não tem Dockerfile; este é do P3 (o mesmo do A8).
    build:
      context: ${SRC_DIR}/p4
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        RUN apt-get update && apt-get install -y --no-install-recommends \
              python3-gi gir1.2-gstreamer-1.0 \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY src/ src/
        COPY config/ config/
        ENV PYTHONPATH=/app:/usr/lib/python3/dist-packages PYTHONUNBUFFERED=1
        CMD ["sh", "-c", "rm -f /tmp/p4_file_shm; exec python -m src.main"]
    image: ods-p4:${P4_REF:?fixe o commit do p4}
    profiles: [video]
    restart: "no"
    ipc: shareable
    environment:
      P4_SOURCE: file
      P4_VIDEO_PATH: /videos/cam0.mp4
      P4_MODO_DIAGNOSTICO: "false"
      P4_ATIVAR_KAFKA: "true"
      P4_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
    volumes:
      - ${VIDEO_DIR:?defina VIDEO_DIR}:/videos:ro
      - p4-shm:/tmp
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }
      i2: { condition: service_started }
      s1: { condition: service_started }

  i1:
    # Detecção · MOD-1. Lê os quadros do P4 pela memória compartilhada; CPU (ultralytics).
    build: ${SRC_DIR}/i1
    image: ods-i1:${I1_REF:?fixe o commit do i1}
    profiles: [video]
    restart: on-failure:5
    ipc: "service:p4"
    environment:
      ODS_KAFKA_BROKER: ${KAFKA_BROKER}
    # PROVISÓRIO (o mesmo do A8): o run_detector.py (30df178) usa "os" e "BROKER_ENV_VAR" sem
    # importá-los. Quando a MOD-1 corrigir, volte para ["python3", "I1/run_detector.py", <argumentos>].
    command: ["python3", "-c",
              "import builtins, os, runpy, sys; from detector.config import BROKER_ENV_VAR; builtins.os = os; builtins.BROKER_ENV_VAR = BROKER_ENV_VAR; sys.argv = ['I1/run_detector.py'] + sys.argv[1:]; runpy.run_path('I1/run_detector.py', run_name='__main__')",
              "--backend", "ultralytics",
              "--onnx", "${I1_ONNX}", "--metadata", "${I1_METADATA}",
              "--source", "p4_file", "--max-frames", "1000000", "--conf", "0.50",
              "--mode", "kafka", "--output-jsonl", "/app/i1-eventos.jsonl"]
    volumes:
      - p4-shm:/tmp
      - ${MODELOS_DIR:?defina MODELOS_DIR}:/modelos:ro
    depends_on: [p4]

  i2:
    # Rastreio · INV-1. Consome ods.i1.detections, publica ods.i2.tracks.
    build: ${SRC_DIR}/i2
    image: ods-i2:${I2_REF:?fixe o commit do i2}
    restart: unless-stopped
    command: ["--i1", "${KAFKA_BROKER}", "--kafka", "${KAFKA_BROKER}", "--fps", "${VIDEO_FPS:-10}"]
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s1:
    # Zonas e ocupação · VER-6. Consome ods.i2.tracks, publica ods.s1.*.
    # Zonas de exemplo do P3 (PIXELS) até o VER-6 publicar as do A3 (o editor do A3 não publica).
    build: ${SRC_DIR}/s1
    image: ods-s1:${S1_REF:?fixe o commit do s1}
    restart: unless-stopped
    environment:
      S1_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      S1_ZONES_FILE: /artefatos/zones-a3-p3-1.json
      S1_ZONES_VERSION: zones-a3-p3-1
    volumes:
      - ./artefatos:/artefatos:ro
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s4:
    # Evidência de mídia · MOD-2. Perfil "cadeia". API em 127.0.0.1:18084.
    build:
      context: ${SRC_DIR}/s4
      target: production
    image: ods-s4:${S4_REF:?fixe o commit do s4}
    profiles: [cadeia]
    restart: unless-stopped
    command: ["/app/s4_media_evidence", "--port", "18084", "--db", "/data/s4.db",
              "--media-dir", "/data/media", "--media-quota-bytes", "${S4_MEDIA_QUOTA_BYTES:-1073741824}"]
    environment:
      ODS_S4_KAFKA_BROKERS: ${KAFKA_BROKER}
      ODS_S4_KAFKA_GROUP_ID: s4-media-evidence-a3
      ODS_S4_KAFKA_CLIENT_ID: s4
      ODS_S4_SOURCE: /videos/cam0.mp4
      ODS_S4_FPS: ${VIDEO_FPS:-10}
    volumes:
      - s4-dados:/data
      - ${VIDEO_DIR}:/videos:ro
    ports:
      - "127.0.0.1:18084:18084"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s5:
    # Métricas · MOD-2. Perfil "cadeia". API em 127.0.0.1:8000.
    build: ${SRC_DIR}/s5
    image: ods-s5:${S5_REF:?fixe o commit do s5}
    profiles: [cadeia]
    restart: unless-stopped
    environment:
      S5_KAFKA_BROKERS: ${KAFKA_BROKER}
      S5_KAFKA_GROUP_ID: S5-metricas-a3
      S5_ARTIFACTS: /artefatos/zones-a3-p3-1.descriptor.json
      S5_ARTIFACT_REGISTRY_DIR: /artefatos
    volumes:
      - s5-dados:/data
      - ./artefatos:/artefatos:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }


  aceite:
    # Teste de aceitação (a3.sh testar): aceite/aceite_a3.py + biblioteca ../comum/aceite.
    build:
      context: ../comum/aceite
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        RUN pip install --no-cache-dir confluent-kafka==2.6.1 cryptography==43.0.3
    image: ods-aceite:1
    profiles: [aceite]
    restart: "no"
    user: "${UID_GID:-1000:1000}"
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      RESULT_DIR: /resultados
      B4_DIR: /b4
      VIDEO_SOURCE_ID: file_cam0
    command: ["python", "-u", "/aceite/aceite_a3.py"]
    volumes:
      - ./aceite:/aceite:ro
      - ../comum/aceite:/comum:ro
      - ${SRC_DIR}/b4/tests/integration:/b4:ro
      - ./resultados:/resultados

volumes:
  p4-shm: {}
  s3-dados: {}
  s4-dados: {}
  s5-dados: {}
