# ODS — build mínima do A8 · Estacionamento (VER-5)
# Montada a partir do código atual dos repositórios, não só do plano 6c.
#
# O backend do A8 hoje consome um único tópico: ods.i7.plate_read.
# O Kafka NÃO faz parte desta build: o Guia de Uso do Kafka (TRA-1) proíbe broker
# paralelo e manda todos usarem o barramento compartilhado (container "kafka" da Jetson).
#
# A build usa o listener PRIVATE desse Kafka (porta 9093), que anuncia o IP da
# Jetson na rede do laboratório e por isso funciona de dentro de containers.
# A porta 9092 (INTERNAL) anuncia localhost e só serve fora de containers.
#
# Por isso o mínimo é:
#   a8-mysql    banco do A8
#   a8-backend  API, consome ods.i7.plate_read
#   a8-frontend interface (Expo)
#   i7          leitura de placas; hoje processa uma pasta de imagens e publica no Kafka
#
# Cadeia completa do plano 6c (versão base, ver a parte "cadeia" no fim do arquivo):
#   p4 (vídeo) -> i1 (detecção) -> i2 (rastreio) -> s1 (zonas) -> s5 (métricas)
#   s4 (evidência de mídia), i3 (calibração, sob demanda)
#   Fica de fora: S2, que ainda não conversa com o Kafka (lê e grava arquivos JSON).
#
# Sem CI: as imagens são construídas na própria Jetson, a partir dos clones em SRC_DIR,
# no commit fixado em a8.env (rode ./preparar-codigo.sh antes).
#
# Uso:
#   ./preparar-codigo.sh
#   docker compose --env-file a8.env --env-file a8.secrets.env build
#   docker compose --env-file a8.env --env-file a8.secrets.env up -d
#   docker compose --env-file a8.env --env-file a8.secrets.env run --rm i7     # processa as imagens
#   docker compose --env-file a8.env --env-file a8.secrets.env --profile video up -d p4 i1   # toca o vídeo

name: ods-a8

services:

  a8-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: a8
      MYSQL_ROOT_PASSWORD: ${A8_DB_PASSWORD:?defina A8_DB_PASSWORD em a8.secrets.env}
    volumes:
      - a8-mysql:/var/lib/mysql
      - ${SRC_DIR:?defina SRC_DIR}/a8/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  a8-backend:
    build: ${SRC_DIR}/a8/backend
    image: ods-a8-backend:${A8_REF:?fixe o commit do a8}
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: a8-mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${A8_DB_PASSWORD}
      DB_NAME: a8
      JWT_SECRET: ${A8_JWT_SECRET:?defina A8_JWT_SECRET em a8.secrets.env}
      JWT_EXPIRES_IN: 7d
      KAFKA_ATIVO: "true"
      KAFKA_BROKER: ${KAFKA_BROKER:?defina KAFKA_BROKER}
      KAFKA_TOPICO: ods.i7.plate_read
      KAFKA_GROUP_ID: A8-acesso
      KAFKA_DESDE_O_INICIO: "false"
    ports:
      - "3000:3000"
    depends_on:
      a8-mysql: { condition: service_healthy }

  a8-frontend:
    build: ${SRC_DIR}/a8/frontend
    image: ods-a8-frontend:${A8_REF}
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://${JETSON_IP:?defina JETSON_IP}:3000
    ports:
      - "8081:8081"
    depends_on: [a8-backend]

  i7:
    # Processamento sob demanda: não sobe com "up"; rode com "run --rm i7".
    build: ${SRC_DIR}/i7
    image: ods-i7:${I7_REF:?fixe o commit do i7}
    profiles: [i7]
    restart: "no"
    environment:
      PUBLICACAO_MODO: kafka
      KAFKA_BROKER: ${KAFKA_BROKER:?defina KAFKA_BROKER}
      KAFKA_TOPICO: ods.i7.plate_read
      SOURCE_ID: ${I7_SOURCE_ID:-cam-entrada}
      PASTA_IMAGENS: /dados/imagens
      PASTA_SAIDA: /dados/saidas
      OCR_MODELO: cct-s-v2-global-model
    volumes:
      - ${I7_IMAGENS_DIR:?defina I7_IMAGENS_DIR}:/dados/imagens:ro
      - i7-saidas:/dados/saidas
      - i7-cache:/root/.cache

  # ======================= cadeia do plano 6c (versão base) =======================
  # Fonte de vídeo: o P4 em modo arquivo, com VIDEO_DIR/cam0.mp4 (source_id "file_cam0").
  # Zonas de exemplo do P3 em ./artefatos (PIXELS, 1280x720), até o VER-5 publicar as reais.

  kafka-topicos:
    # Cria, se ainda não existirem, os tópicos da cadeia no Kafka da turma. Roda e termina.
    image: confluentinc/cp-kafka:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ods.session.started ods.p4.frame ods.i1.detections ods.i2.tracks
        ods.i3.calibration ods.artifact.published ods.s1.position ods.s1.zone_transition
        ods.s1.zone_occupancy ods.s2.event ods.s2.entity ods.s4.clip ods.s4.capture.command
        ods.s4.capture.reply ods.s4.clip.query ods.s4.clip.query.reply ods.s5.zone_metrics
        ods.s5.event_metrics ods.s5.metrics.query ods.s5.metrics.reply ods.s5.heatmap.query; do
        kafka-topics --bootstrap-server ${KAFKA_BROKER} --create --if-not-exists
        --topic $$t --partitions 1 --replication-factor 1 || exit 1; done

  p4:
    # Fonte de vídeo · SIS-2. O repo não tem Dockerfile; este é do P3.
    # Toca o vídeo uma vez e termina; rode de novo com "--profile video up -d p4 i1".
    build:
      context: ${SRC_DIR}/p4
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        RUN apt-get update && apt-get install -y --no-install-recommends \
              python3-gi gir1.2-gstreamer-1.0 \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY src/ src/
        COPY config/ config/
        ENV PYTHONPATH=/app:/usr/lib/python3/dist-packages PYTHONUNBUFFERED=1
        CMD ["sh", "-c", "rm -f /tmp/p4_file_shm; exec python -m src.main"]
    image: ods-p4:${P4_REF:?fixe o commit do p4}
    profiles: [video]
    restart: "no"
    ipc: shareable
    environment:
      P4_SOURCE: file
      P4_VIDEO_PATH: /videos/cam0.mp4
      P4_MODO_DIAGNOSTICO: "false"
      P4_ATIVAR_KAFKA: "true"
      P4_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
    volumes:
      - ${VIDEO_DIR:?defina VIDEO_DIR}:/videos:ro
      - p4-shm:/tmp
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }
      i2: { condition: service_started }
      s1: { condition: service_started }
      s4: { condition: service_started }
      s5: { condition: service_started }

  i1:
    # Detecção · MOD-1. Lê os quadros do P4 pela memória compartilhada; CPU (ultralytics).
    build: ${SRC_DIR}/i1
    image: ods-i1:${I1_REF:?fixe o commit do i1}
    profiles: [video]
    restart: on-failure:5
    ipc: "service:p4"
    environment:
      ODS_KAFKA_BROKER: ${KAFKA_BROKER}
    # PROVISÓRIO: o run_detector.py (30df178) usa "os" e "BROKER_ENV_VAR" sem importá-los
    # e cai com NameError (pyflakes não acusa outros nomes). O prefixo abaixo deixa os dois
    # disponíveis sem alterar o código da MOD-1.
    # Quando corrigirem, volte para: ["python3", "I1/run_detector.py", <mesmos argumentos>]
    command: ["python3", "-c",
              "import builtins, os, runpy, sys; from detector.config import BROKER_ENV_VAR; builtins.os = os; builtins.BROKER_ENV_VAR = BROKER_ENV_VAR; sys.argv = ['I1/run_detector.py'] + sys.argv[1:]; runpy.run_path('I1/run_detector.py', run_name='__main__')",
              "--backend", "ultralytics",
              "--source", "p4_file", "--max-frames", "1000000", "--conf", "0.50",
              "--mode", "kafka", "--output-jsonl", "/app/i1-eventos.jsonl"]
    volumes:
      - p4-shm:/tmp
    depends_on: [p4]

  i2:
    # Rastreio · INV-1. Consome ods.i1.detections, publica ods.i2.tracks.
    build: ${SRC_DIR}/i2
    image: ods-i2:${I2_REF:?fixe o commit do i2}
    restart: unless-stopped
    command: ["--i1", "${KAFKA_BROKER}", "--kafka", "${KAFKA_BROKER}", "--fps", "${VIDEO_FPS:-10}"]
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  i3:
    # Calibração · INV-1. Artefato, não serviço: roda sob demanda com as medidas da câmera:
    #   dc run --rm -T i3 < correspondencias.csv
    build: ${SRC_DIR}/i3
    image: ods-i3:${I3_REF:?fixe o commit do i3}
    profiles: [i3]
    restart: "no"
    command: ["--source-id", "file_cam0", "--espaco", "estacionamento-p3",
              "--largura", "1280", "--altura", "720", "--kafka", "${KAFKA_BROKER}"]

  s1:
    # Zonas e ocupação · VER-6. Consome ods.i2.tracks, publica ods.s1.*.
    build: ${SRC_DIR}/s1
    image: ods-s1:${S1_REF:?fixe o commit do s1}
    restart: unless-stopped
    environment:
      S1_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      S1_ZONES_FILE: /artefatos/zones-a8-p3-1.json
      S1_ZONES_VERSION: zones-a8-p3-1
    volumes:
      - ./artefatos:/artefatos:ro
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s4:
    # Evidência de mídia · MOD-2. Grava a partir do mesmo MP4 (o formato do SHM do P4
    # ainda não é o que o S4 lê). API em 127.0.0.1:18084.
    build:
      context: ${SRC_DIR}/s4
      target: production
    image: ods-s4:${S4_REF:?fixe o commit do s4}
    restart: unless-stopped
    # Teto de mídia: sem ele, o S4 só expurga com o disco da placa em 85%.
    command: ["/app/s4_media_evidence", "--port", "18084", "--db", "/data/s4.db",
              "--media-dir", "/data/media", "--media-quota-bytes", "${S4_MEDIA_QUOTA_BYTES:-1073741824}"]
    environment:
      ODS_S4_KAFKA_BROKERS: ${KAFKA_BROKER}
      ODS_S4_KAFKA_GROUP_ID: s4-media-evidence
      ODS_S4_KAFKA_CLIENT_ID: s4
      ODS_S4_SOURCE: /videos/cam0.mp4
      ODS_S4_FPS: ${VIDEO_FPS:-10}
    volumes:
      - s4-dados:/data
      - ${VIDEO_DIR}:/videos:ro
    ports:
      - "127.0.0.1:18084:18084"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s5:
    # Métricas · MOD-2. Consome ods.s1.* (e ods.s2.* quando existir). API em 127.0.0.1:8000.
    build: ${SRC_DIR}/s5
    image: ods-s5:${S5_REF:?fixe o commit do s5}
    restart: unless-stopped
    environment:
      S5_KAFKA_BROKERS: ${KAFKA_BROKER}
      S5_KAFKA_GROUP_ID: S5-metricas
      S5_ARTIFACTS: /artefatos/zones-a8-p3-1.descriptor.json
      S5_ARTIFACT_REGISTRY_DIR: /artefatos
    volumes:
      - s5-dados:/data
      - ./artefatos:/artefatos:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

volumes:
  a8-mysql: {}
  i7-saidas: {}
  i7-cache: {}
  p4-shm: {}
  s4-dados: {}
  s5-dados: {}