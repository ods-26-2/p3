# ODS — build dedicada do I1 · Detecção (MOD-1), serviço permanente na Jetson (P3 / SIS-1)
#
# O I1 fica sempre de pé, esperando pedidos no Kafka. Desde o commit 3b2a9cc (develop, 20/11/2026)
# o I1 tem um orquestrador (I1/run_orchestrator.py) que:
#   - escuta ods.i1.command: {"action": "START" | "HEARTBEAT" | "STOP", "squad": "VER5", ...};
#   - atende um pedido por vez, em fila FIFO, com um só modelo carregado na GPU (P2/TensorRT);
#   - troca o modelo pela equipe: VER5/A8 placas, VER3/A5 e VER6/A3 EPI, VER1/A1 indústria,
#     INV1/A4 esporte;
#   - lê o vídeo da equipe (VIDEO_DIR/<SQUAD>.mp4), um arquivo indicado no comando ("source") ou
#     os quadros do P4 pela memória compartilhada ("source": "video" | "imx519" | "imx477");
#   - publica em ods.i1.detections (source_id = o do comando, ou o nome da equipe).
#
# Esta build é usada junto com outras: a de "todas as inferências" (e as das aplicações) só
# mandam comandos e leem ods.i1.detections; não sobem um I1 próprio.
#
# O Kafka NÃO faz parte da build (o Guia de Uso do Kafka, TRA-1, proíbe broker paralelo): desde
# 23/11/2026 as aplicações estão na nuvem e o I1 usa o Kafka da nuvem (KAFKA_BROKER no i1.env).
#
# Uso: ./i1.sh (sobe), ./i1.sh testar, ./i1.sh status, ./i1.sh parar. Veja validacao/i1/GUIA-BUILD-I1.md.

name: ods-i1

x-logs: &logs
  # Serviço que nunca para: sem rotação, o log do Docker cresceria até encher o cartão.
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  kafka-topicos:
    # Cria, se ainda não existirem, os tópicos do I1 no Kafka da turma. Roda e termina.
    image: confluentinc/cp-kafka:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ${I1_COMMAND_TOPIC:-ods.i1.command} ods.i1.detections; do
        kafka-topics --bootstrap-server ${KAFKA_BROKER:?defina KAFKA_BROKER} --create --if-not-exists
        --topic $$t --partitions 1 --replication-factor 1 || exit 1; done

  i1-engine:
    # One-shot · P3. Garante a engine TensorRT FP16 de cada pacote de I1_PACOTES em I1_ENGINES_DIR:
    # se já existe e carrega com o TensorRT da imagem, segue em segundos; senão roda o p2-build
    # (~7 min por pacote na primeira vez). O ./i1.sh roda este serviço depois do "up".
    image: ods-i1-gpu:${I1_REF:?fixe o commit do i1}
    pull_policy: never
    profiles: [engine]
    restart: "no"
    runtime: nvidia
    environment:
      P2_BACKEND: trt
      P2_ENGINE_DIR: /opt/ods/engines
      I1_PACOTES: ${I1_PACOTES:?defina I1_PACOTES}
    volumes:
      - ${I1_ENGINES_DIR:?defina I1_ENGINES_DIR}:/opt/ods/engines
      - ../comum/i1/preparar-engine.sh:/p3/preparar-engine.sh:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        for p in $$I1_PACOTES; do sh /p3/preparar-engine.sh /app/I1/artifacts/$$p FP16 || exit 1; done

  i1:
    # Detecção · MOD-1. Orquestrador do I1 na GPU (TensorRT via P2), sempre de pé.
    # Imagem do Dockerfile.jetson do I1 (p2[trt,cpu]), a mesma receita do A8 e do A5.
    # CONTORNO DO P3: o Dockerfile parte da l4t-jetpack:r36.4.0, que gerou uma imagem de 16,5 GB
    # (13/11/2026). Pelo ARG BASE_IMAGE do próprio Dockerfile, usamos a l4t-tensorrt runtime (mesmo
    # TensorRT 10.3, já na placa). Para desfazer: tire o "args".
    build:
      context: ${SRC_DIR:?defina SRC_DIR}/i1
      dockerfile: Dockerfile.jetson
      args:
        BASE_IMAGE: ${I1_BASE_IMAGE:?defina I1_BASE_IMAGE}
    image: ods-i1-gpu:${I1_REF:?fixe o commit do i1}
    # Volta sozinho depois de queda ou reinício da placa. Sem o Kafka da turma no ar, o cliente
    # Kafka tenta de novo sozinho (o processo não cai).
    restart: unless-stopped
    runtime: nvidia
    # Memória compartilhada do P4 de OUTRA build: o shmsink do P4 cria o segmento em /dev/shm e
    # avisa pelo socket em /tmp. Com ipc "host" nos dois lados, o I1 enxerga o segmento; o socket
    # vem pela pasta I1_P4_DIR do host, montada em /tmp aqui e no P4. (O compose do próprio I1 faz
    # o mesmo com ipc host e /tmp:/tmp.) Sem P4, não atrapalha.
    ipc: host
    environment:
      ODS_KAFKA_BROKER: ${KAFKA_BROKER:?defina KAFKA_BROKER}
      I1_COMMAND_TOPIC: ${I1_COMMAND_TOPIC:-ods.i1.command}
      I1_CONSUMER_GROUP: ${I1_CONSUMER_GROUP:-ods-i1-orchestrator}
      I1_BACKEND: p2
      I1_MODE: kafka
      I1_VIDEOS_DIR: /videos
      I1_DEFAULT_TTL: ${I1_DEFAULT_TTL:-60}
      I1_CONF: ${I1_CONF:-0.50}
      # P2_BACKEND=trt: sem TensorRT o P2 dá erro em vez de cair calado para a CPU.
      P2_BACKEND: trt
      P2_ENGINE_DIR: /opt/ods/engines
      PYTHONUNBUFFERED: "1"
    # Sem "--allow-fixtures-fallback": sem vídeo da equipe o pedido falha (fica no log) em vez de
    # publicar as imagens de exemplo do pacote como se fossem da câmera.
    command: ["python3", "-u", "I1/run_orchestrator.py"]
    # Ao parar, o orquestrador libera o modelo da GPU antes de sair.
    stop_grace_period: 30s
    logging: *logs
    volumes:
      - ${I1_ENGINES_DIR:?defina I1_ENGINES_DIR}:/opt/ods/engines:ro
      - ${VIDEO_DIR:?defina VIDEO_DIR}:/videos:ro
      - ${I1_P4_DIR:?defina I1_P4_DIR}:/tmp
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  aceite:
    # Teste de aceitação do I1 (./i1.sh testar): aceite/aceite_i1.py + ../comum/aceite.
    # Usa a própria imagem do I1 (já tem confluent-kafka, jsonschema e o schema do I1): nada a
    # construir. Sem GPU; o entrypoint vazio pula o aviso "== CUDA ==" das imagens l4t.
    image: ods-i1-gpu:${I1_REF}
    pull_policy: never
    profiles: [aceite]
    restart: "no"
    user: "${UID_GID:-1000:1000}"
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      I1_COMMAND_TOPIC: ${I1_COMMAND_TOPIC:-ods.i1.command}
      I1_PACOTES: ${I1_PACOTES}
      I1_TESTE_VIDEOS: ${I1_VIDEOS:-}
      I1_TESTE_QUADROS: ${I1_TESTE_QUADROS:-30}
      I1_REF: ${I1_REF}
      RESULT_DIR: /resultados
      B4_DIR: /b4
      I1_SCHEMA: /app/schemas/ods.i1.detections.v1.0.schema.json
    entrypoint: ["python3", "-u", "/aceite/aceite_i1.py"]
    volumes:
      - ./aceite:/aceite:ro
      - ../comum/aceite:/comum:ro
      - ${SRC_DIR}/b4/tests/integration:/b4:ro
      - ./resultados:/resultados
      - ${VIDEO_DIR}:/videos:ro
