# ODS — build do A7 · Restaurante / áudio e voz (VER-4)
# Montada a partir do código atual (main do a7 e do i5, 13/11/2026), não só do plano 6c.
#
# O que o código do A7 consome hoje:
#   ods.i5.transcript   (fala transcrita pelo I5)
#   ods.s5.event.metrics, opcional (S5_KAFKA_ENABLED; nome fora da 6c, que diz
#   ods.s5.event_metrics, e o S5 não tem fonte de eventos para o A7) -> desligado nesta build
#
# Composição:
#   a7   servidor do A7 (FastAPI + telas, porta A7_PORTA). Sem Dockerfile no repo: o daqui é do P3.
#        A classificação de intenção tenta um modelo local via Ollama (127.0.0.1:11434); sem
#        ele, o próprio A7 cai no classificador por similaridade (RapidFuzz). O Ollama não
#        entra na build (ocupa vários GB).
#   i5   perfil "i5", sob demanda (./a7.sh fala): transcreve um arquivo de áudio com o
#        pipeline do I5 (VAD + Whisper small, em CPU) e publica ods.i5.transcript.
#        Sem Dockerfile no repo: o daqui é do P3. O Whisper (~1 GB) é baixado na primeira
#        execução e fica no volume i5-cache.
#
# Fora, com o motivo:
#   P5   o repositório p5 só tem um script de teste do microfone, sem Kafka
#        (o I5 em modo contínuo espera ods.p5.audio_chunk)
#   S3, S4, I6, S5   a 6c lista, mas o código atual do A7 não os usa
#
# Uso: ./a7.sh · ./a7.sh fala · ./a7.sh status · ./a7.sh parar

name: ods-a7

services:

  a7:
    build:
      context: ${SRC_DIR:?defina SRC_DIR}/a7
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY main.py ./
        COPY src/ src/
        COPY web/ web/
        COPY config/ config/
        COPY data/ data/
        EXPOSE 8000
        CMD ["python", "main.py", "--server", "--port", "8000"]
    image: ods-a7:${A7_REF:?fixe o commit do a7}
    restart: unless-stopped
    environment:
      KAFKA_ENABLED: "1"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:?defina KAFKA_BROKER}
      KAFKA_TOPIC: ods.i5.transcript
      KAFKA_GROUP_ID: a7-varejo-nlu
      S5_KAFKA_ENABLED: "0"
    ports:
      - "${A7_PORTA:-8000}:8000"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  i5:
    # Fala · VER-4. Transcreve I5_AUDIO_DIR/I5_AUDIO e publica ods.i5.transcript.
    build:
      context: ${SRC_DIR}/i5
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/app HF_HOME=/cache/huggingface
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg libsndfile1 \
            && rm -rf /var/lib/apt/lists/*
        # torch só de CPU antes do resto, para o pip não trazer as bibliotecas CUDA
        RUN pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY src/ src/
        COPY config/ config/
        ENTRYPOINT ["python", "-u", "src/pipeline.py"]
    image: ods-i5:${I5_REF:?fixe o commit do i5}
    profiles: [i5]
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      KAFKA_TOPIC: ods.i5.transcript
    # Config do I5 com Whisper em CPU/float32 (cópia do P3 em ./i5; ver o cabeçalho do arquivo).
    command: ["/audios/${I5_AUDIO:-audio4.ogg}", "--config", "/p3/i5/pipeline_config.yaml",
              "--publish-kafka", "--kafka-broker", "${KAFKA_BROKER}", "--kafka-topic", "ods.i5.transcript",
              "--origem", "${I5_ORIGEM:-mic_balcao_1}", "--no-save-json"]
    volumes:
      - ${I5_AUDIO_DIR:?defina I5_AUDIO_DIR}:/audios:ro
      - ./i5:/p3/i5:ro
      - i5-cache:/cache

  kafka-topicos:
    # Cria, se ainda não existirem, os tópicos desta build no Kafka da turma. Roda e termina.
    image: confluentinc/cp-kafka:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ods.i5.transcript ods.p5.audio_chunk ods.session.started; do
        kafka-topics --bootstrap-server ${KAFKA_BROKER} --create --if-not-exists
        --topic $$t --partitions 1 --replication-factor 1 || exit 1; done


  aceite:
    # Teste de aceitação (a7.sh testar): aceite/aceite_a7.py + biblioteca ../comum/aceite.
    build:
      context: ../comum/aceite
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        RUN pip install --no-cache-dir confluent-kafka==2.6.1 cryptography==43.0.3
    image: ods-aceite:1
    profiles: [aceite]
    restart: "no"
    user: "${UID_GID:-1000:1000}"
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      RESULT_DIR: /resultados
      B4_DIR: /b4
      I5_ORIGEM: ${I5_ORIGEM:-mic_balcao_1}
    command: ["python", "-u", "/aceite/aceite_a7.py"]
    volumes:
      - ./aceite:/aceite:ro
      - ../comum/aceite:/comum:ro
      - ${SRC_DIR}/b4/tests/integration:/b4:ro
      - ./resultados:/resultados

volumes:
  i5-cache: {}
