# ODS — build do A5 · EPI / segurança (VER-3)
# Montada a partir do código atual (main; revisada em 17/11/2026), não só do plano 6c.
#
# O que o código do A5 usa no Kafka (A5_BUS=kafka; docs/kafka.md do A5):
#   ods.s3.alert, ods.s3.alert_action.*, ods.s3.alerts.*   (S3)
#   ods.s4.clip, ods.s4.clip.query                         (S4)
#   ods.s2.rules.command/.reply                            (S2: sem Kafka -> o pedido expira, 504)
#   ods.artifact.published                                 (anuncia ZONES, RULES, PPE_CATALOG, ROUTING)
# P6 e I3 continuam simulados dentro do A5 (decisão do VER-3).
#
# Composição:
#   a5-backend   API (FastAPI) em 127.0.0.1:8000; o acesso é pelo nginx do front
#   a5-frontend  interface (porta 8095) e registro de artefatos em /registro
#   s3           alertas · VER-3, com o ROUTING de exemplo do A5 que vem na imagem do S3
#   s4           evidência de mídia, lendo VIDEO_DIR/VIDEO_ARQUIVO
#   i9, i2, s1   perfil "cadeia": EPI relacional, rastreio e zonas (alimentariam o S2)
#   p4, i1       perfil "video": toca VIDEO_DIR/VIDEO_ARQUIVO uma vez; I1 na GPU com o modelo
#                de EPI do B5 (app-epi 1.0.0: pessoa, capacete, colete), como o I1 do A8
#   i1-engine    perfil "video", one-shot: compila a engine TensorRT só se faltar
#
# Fora: S2 (sem Kafka) — sem ele não há ods.s2.event, então nenhum alerta automático de EPI
# nasce da cadeia (P4 -> I1 -> I9 para no ods.i9.ppe_compliance); os alertas do A5 hoje vêm de
# comandos. O I3 continua simulado dentro do A5 (decisão do VER-3), e o I9 roda sem calibração.
#
# Uso: ./a5.sh · ./a5.sh cadeia · ./a5.sh video · ./a5.sh status · ./a5.sh parar

name: ods-a5

services:

  a5-backend:
    build: ${SRC_DIR:?defina SRC_DIR}/a5/a5-epi-seguranca
    image: ods-a5-backend:${A5_REF:?fixe o commit do a5}
    restart: unless-stopped
    environment:
      A5_ENV: ${A5_ENV:-production}
      A5_LOG_LEVEL: INFO
      A5_BUS: kafka
      A5_KAFKA_BOOTSTRAP: ${KAFKA_BROKER:?defina KAFKA_BROKER}
      A5_KAFKA_GROUP_ID: A5-backend
      A5_KAFKA_ENVELOPE_OCCURRED_AT: "false"
      A5_DATABASE_URL: sqlite:////data/a5.db
      # Endereço que os outros componentes usam para baixar os artefatos do A5
      A5_REGISTRY_BASE_URL: http://${JETSON_IP:?defina JETSON_IP}:8095/registro
      A5_EXIGIR_LOGIN: ${A5_EXIGIR_LOGIN:-true}
      A5_ADMIN_SENHA: ${A5_ADMIN_SENHA:?defina A5_ADMIN_SENHA em a5.secrets.env}
      A5_ZONAS_COORDENADAS: PIXELS
    networks:
      default:
        # O nginx do front do A5 tem "backend:8000" fixo.
        aliases: [backend]
    volumes:
      - a5-dados:/data
    ports:
      - "127.0.0.1:8000:8000"
    # Healthcheck de porta, o mesmo do compose do VER-3. O backend só abre a 8000 depois do
    # lifespan, que publica os artefatos e espera o reply do S2 às regras (2 × 10 s). Sem o S2 no
    # Kafka, toda partida fica ~20 s fechada; sem este healthcheck o a5.sh seguia com o container
    # só "running" e o nginx respondia 502 (Jetson, 17/11/2026).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  a5-frontend:
    build: ${SRC_DIR}/a5/frontend
    image: ods-a5-frontend:${A5_REF}
    restart: unless-stopped
    ports:
      # 8095 em vez de 8080, como o VER-3 definiu (a Jetson já usa 8080)
      - "8095:80"
    # O nginx só sobe com o backend aceitando conexões (senão as primeiras chamadas dão 502).
    depends_on:
      a5-backend: { condition: service_healthy }

  s3:
    # Alertas e notificações · VER-3. Comando padrão da imagem: ROUTING e permissões de
    # exemplo do A5 (routing-a5-1), banco em /dados e criação dos tópicos do S3.
    build: ${SRC_DIR}/s3
    image: ods-s3:${S3_REF:?fixe o commit do s3}
    restart: unless-stopped
    environment:
      S3_KAFKA_BOOTSTRAP: ${KAFKA_BROKER}
      S3_KAFKA_GROUP_ID: S3-alertas-a5
      S3_PRODUTORES_COMANDOS: A5
    volumes:
      - s3-dados:/dados
      # Permissões de ACKNOWLEDGE/MUTE/CLOSE: as do A5 (GET /integracoes/s3/permissoes), não o
      # exemplo do contrato que vem na imagem (só user:maria e user:joao; o A5 age como
      # user:administrador e recebia UNAUTHORIZED_ACTOR, Jetson 17/11/2026). O S3 lê o arquivo só
      # na partida: o a5.sh o cria de config/permissoes-s3.exemplo.json, atualiza a partir do A5
      # e reinicia o S3 quando muda.
      # CONTORNO DO P3: o A5 só lista em "members" os papéis com usuários, e o S3 recusa ação com
      # papel fora de "members"; o a5.sh acrescenta esses papéis com lista vazia (mesmo efeito).
      - ./estado/permissoes-s3.json:/config/permissoes.json:ro
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  kafka-topicos:
    # Cria, se ainda não existirem, os tópicos desta build no Kafka da turma. Roda e termina.
    image: confluentinc/cp-kafka:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ods.session.started ods.p4.frame ods.i1.detections ods.i2.tracks
        ods.i3.calibration ods.artifact.published ods.i9.ppe_compliance ods.i9.dlq
        ods.s1.position ods.s1.zone_transition ods.s1.zone_occupancy
        ods.s2.event ods.s2.entity ods.s2.rules.command ods.s2.rules.reply
        ods.s3.alert ods.s3.alert.command ods.s3.alert.reply ods.s3.alert_action.command
        ods.s3.alert_action.reply ods.s3.alerts.query ods.s3.alerts.reply
        ods.s4.clip ods.s4.capture.command ods.s4.capture.reply ods.s4.clip.query
        ods.s4.clip.reply ods.s4.clip.query.reply; do
        kafka-topics --bootstrap-server ${KAFKA_BROKER} --create --if-not-exists
        --topic $$t --partitions 1 --replication-factor 1 || exit 1; done

  s4:
    # Evidência de mídia · MOD-2. Grava a partir do próprio MP4. API em 127.0.0.1:18084.
    build:
      context: ${SRC_DIR}/s4
      target: production
    image: ods-s4:${S4_REF:?fixe o commit do s4}
    restart: unless-stopped
    command: ["/app/s4_media_evidence", "--port", "18084", "--db", "/data/s4.db",
              "--media-dir", "/data/media", "--media-quota-bytes", "${S4_MEDIA_QUOTA_BYTES:-1073741824}"]
    environment:
      ODS_S4_KAFKA_BROKERS: ${KAFKA_BROKER}
      ODS_S4_KAFKA_GROUP_ID: s4-media-evidence-a5
      ODS_S4_KAFKA_CLIENT_ID: s4
      ODS_S4_SOURCE: /videos/${VIDEO_ARQUIVO:?defina VIDEO_ARQUIVO}
      ODS_S4_FPS: ${VIDEO_FPS:-10}
    volumes:
      - s4-dados:/data
      - ${VIDEO_DIR:?defina VIDEO_DIR}:/videos:ro
    ports:
      - "127.0.0.1:18084:18084"
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  # ======================= cadeia =======================

  i9:
    # Conformidade de EPI · VER-3. Consome ods.i1.detections, ods.i3.calibration e
    # ods.artifact.published (catálogo do A5); publica ods.i9.ppe_compliance.
    # O repo não tem Dockerfile; este é do P3. Copia só o código: o dataset (323 MB) fica fora.
    build:
      context: ${SRC_DIR}/i9/I9
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        WORKDIR /app
        COPY requirements-kafka.txt .
        RUN pip install --no-cache-dir -r requirements-kafka.txt
        COPY main.py calibrate.py evaluate.py optimize.py policy_calibrated.json ./
        COPY src/ src/
        COPY config/ config/
        COPY examples/ examples/
        COPY tools/ tools/
        CMD ["python", "-u", "main.py", "--kafka"]
    image: ods-i9:${I9_REF:?fixe o commit do i9}
    profiles: [cadeia]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      I9_KAFKA_GROUP_ID: I9-epi
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  i2:
    # Rastreio · INV-1. Consome ods.i1.detections, publica ods.i2.tracks.
    build: ${SRC_DIR}/i2
    image: ods-i2:${I2_REF:?fixe o commit do i2}
    profiles: [cadeia]
    restart: unless-stopped
    command: ["--i1", "${KAFKA_BROKER}", "--kafka", "${KAFKA_BROKER}", "--fps", "${VIDEO_FPS:-10}"]
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  s1:
    # Zonas · VER-6. Zona de exemplo do P3 (galpao-solda, o nome que o catálogo do A5 usa).
    build: ${SRC_DIR}/s1
    image: ods-s1:${S1_REF:?fixe o commit do s1}
    profiles: [cadeia]
    restart: unless-stopped
    environment:
      S1_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      S1_ZONES_FILE: /artefatos/zones-a5-p3-2.json
      S1_ZONES_VERSION: zones-a5-p3-2
    volumes:
      - ./artefatos:/artefatos:ro
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }

  p4:
    # Fonte de vídeo · SIS-2. O repo não tem Dockerfile; este é do P3 (o mesmo do A8).
    build:
      context: ${SRC_DIR}/p4
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        RUN apt-get update && apt-get install -y --no-install-recommends \
              python3-gi gir1.2-gstreamer-1.0 \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY src/ src/
        COPY config/ config/
        ENV PYTHONPATH=/app:/usr/lib/python3/dist-packages PYTHONUNBUFFERED=1
        CMD ["sh", "-c", "rm -f /tmp/p4_file_shm; exec python -m src.main"]
    image: ods-p4:${P4_REF:?fixe o commit do p4}
    profiles: [video]
    restart: "no"
    ipc: shareable
    environment:
      P4_SOURCE: file
      # source_id publicado: file_<nome sem extensão> (epi.mp4 -> file_epi = VIDEO_SOURCE_ID)
      P4_VIDEO_PATH: /videos/${VIDEO_ARQUIVO:?defina VIDEO_ARQUIVO}
      P4_MODO_DIAGNOSTICO: "false"
      P4_ATIVAR_KAFKA: "true"
      P4_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
    volumes:
      - ${VIDEO_DIR}:/videos:ro
      - p4-shm:/tmp
    depends_on:
      kafka-topicos: { condition: service_completed_successfully }
      # O P4 toca o vídeo uma vez só: espera a engine do I1 existir para não perder quadros
      # enquanto ela compila (minutos na primeira vez).
      i1-engine: { condition: service_completed_successfully }

  i1-engine:
    # One-shot · P3 (o mesmo do A8). Garante a engine TensorRT do pacote I1_PACOTE em
    # I1_ENGINES_DIR: se já existe e carrega, termina em segundos; senão roda o p2-build (FP16,
    # ~7 min na primeira vez). Usa a imagem do serviço i1.
    image: ods-i1-gpu:${I1_REF:?fixe o commit do i1}
    # Imagem local (construída pelo serviço i1); não existe em registro nenhum.
    pull_policy: never
    profiles: [video]
    restart: "no"
    runtime: nvidia
    environment:
      P2_BACKEND: trt
      P2_ENGINE_DIR: /opt/ods/engines
    volumes:
      - ${I1_ENGINES_DIR:?defina I1_ENGINES_DIR}:/opt/ods/engines
      - ../comum/i1/preparar-engine.sh:/p3/preparar-engine.sh:ro
    command: ["sh", "/p3/preparar-engine.sh", "/app/I1/artifacts/${I1_PACOTE:?defina I1_PACOTE}", "FP16"]

  i1:
    # Detecção · MOD-1. Modelo de EPI do B5 (app-epi 1.0.0: pessoa, capacete, colete), na GPU
    # (TensorRT via P2). A mesma imagem do A8 (ods-i1-gpu:<ref>, Dockerfile.jetson do I1).
    # CONTORNO DO P3 (o mesmo do A8): a base l4t-jetpack do Dockerfile.jetson gera imagem de
    # 16,5 GB; pelo ARG BASE_IMAGE usamos a l4t-tensorrt runtime. Para desfazer: tire o "args".
    # P2_BACKEND=trt: sem TensorRT o P2 dá erro em vez de cair calado para a CPU.
    # Prova de GPU: artifact_version das mensagens termina em "-fp16" (app-epi-1.0.0-fp16).
    build:
      context: ${SRC_DIR}/i1
      dockerfile: Dockerfile.jetson
      args:
        BASE_IMAGE: ${I1_BASE_IMAGE:?defina I1_BASE_IMAGE}
    image: ods-i1-gpu:${I1_REF}
    profiles: [video]
    # O I1 ainda sai com código 1 no fim do vídeo ("Control socket has closed"); esperado.
    restart: on-failure:5
    ipc: "service:p4"
    runtime: nvidia
    environment:
      ODS_KAFKA_BROKER: ${KAFKA_BROKER}
      P2_BACKEND: trt
      P2_ENGINE_DIR: /opt/ods/engines
    # CONTORNO DO P3 (o mesmo do A8): espera o socket dos quadros do P4 existir (até 60 s) para
    # não cair e reiniciar no começo do vídeo. Para desfazer: deixe só o comando a partir do "exec".
    command:
      - sh
      - -c
      - >-
        i=0; while [ ! -S /tmp/p4_file_shm ] && [ $$i -lt 120 ]; do sleep 0.5; i=$$((i+1)); done;
        exec python3 I1/run_detector.py --backend p2
        --metadata /app/I1/artifacts/${I1_PACOTE}/metadata.json
        --source p4_file --max-frames 1000000 --conf 0.50
        --mode kafka --output-jsonl /app/i1-eventos.jsonl
    volumes:
      - p4-shm:/tmp
      - ${I1_ENGINES_DIR}:/opt/ods/engines:ro
    depends_on:
      p4: { condition: service_started }
      i1-engine: { condition: service_completed_successfully }


  aceite:
    # Teste de aceitação (a5.sh testar): aceite/aceite_a5.py + biblioteca ../comum/aceite.
    build:
      context: ../comum/aceite
      dockerfile_inline: |
        FROM python:3.11-slim-bookworm
        RUN pip install --no-cache-dir confluent-kafka==2.6.1 cryptography==43.0.3
    image: ods-aceite:1
    profiles: [aceite]
    restart: "no"
    user: "${UID_GID:-1000:1000}"
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      RESULT_DIR: /resultados
      B4_DIR: /b4
      A5_ADMIN_SENHA: ${A5_ADMIN_SENHA}
      VIDEO_SOURCE_ID: ${VIDEO_SOURCE_ID:?defina VIDEO_SOURCE_ID}
      I1_PACOTE: ${I1_PACOTE}
    command: ["python", "-u", "/aceite/aceite_a5.py"]
    volumes:
      - ./aceite:/aceite:ro
      - ../comum/aceite:/comum:ro
      - ${SRC_DIR}/b4/tests/integration:/b4:ro
      - ./resultados:/resultados

volumes:
  a5-dados: {}
  s3-dados: {}
  s4-dados: {}
  p4-shm: {}
